<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数学错题整理智能体</title>
<style>
  :root{--paper:#f4f1ea;--card:#fffdf8;--ink:#1f1d1a;--ink-2:#544e45;--ink-3:#8d8578;
    --line:#e4ddcf;--line-2:#d8cfbd;--accent:#a04a1e;--accent-2:#7c3a18}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;padding:28px}
  .wrap{width:100%;max-width:520px;text-align:center}
  h1{font-size:31px;margin:0 0 10px;letter-spacing:.02em}
  .ver{font-size:12px;color:var(--ink-3);letter-spacing:.04em;margin-bottom:46px}
  a.enter{display:block;text-decoration:none;color:#fff;background:var(--accent);
    border-radius:16px;padding:22px 0;font-size:19px;font-weight:600;letter-spacing:.16em;
    box-shadow:0 12px 26px rgba(143,63,24,.26);transition:transform .12s ease, box-shadow .12s ease}
  a.enter:active{transform:scale(.985);box-shadow:0 7px 16px rgba(143,63,24,.3)}
  @media (max-width:560px){
    h1{font-size:26px}
    .ver{margin-bottom:38px}
    a.enter{padding:20px 0;font-size:18px}
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>数学错题整理智能体</h1>
    <div class="ver">当前版本 v0.25 · 2026-11-24</div>
    <a class="enter" href="app/index.html">点击进入</a>
  </div>
</body>
</html>
